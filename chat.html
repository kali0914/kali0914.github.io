<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f6fa" />
<title>学生论坛 - 网站搬迁通知</title>
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --border: #e5e7eb;
    --radius: 20px;
    --shadow-lg: 0 20px 60px rgba(15, 23, 42, .15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 50% -200px, #e0e7ff 0%, #f5f6fa 60%);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 40px 32px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: pop .4s cubic-bezier(.16, 1, .3, 1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(16px) scale(.98); }
    to { opacity: 1; transform: none; }
  }

  .wrap::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #a855f7);
  }

  .icon-wrap {
    width: 80px; height: 80px;
    margin: 0 auto 22px;
    border-radius: 24px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: grid; place-items: center;
    color: #fff;
    box-shadow: 0 12px 32px rgba(99, 102, 241, .35);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -.3px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 26px;
    line-height: 1.6;
  }

  .new-url-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--primary-soft);
    border: 1px dashed #c7d2fe;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 22px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .new-url-box svg { color: var(--primary); flex: 0 0 auto; }
  .new-url {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    word-break: break-all;
  }

  .countdown-wrap {
    margin-bottom: 24px;
  }
  .countdown-text {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .countdown-num {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
    display: inline-block;
    min-width: 28px;
    transition: transform .15s;
  }
  .countdown-num.tick {
    transform: scale(1.15);
  }

  .progress-track {
    height: 6px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 999px;
    transition: width 1s linear;
    position: relative;
  }
  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  .btn-jump {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: .18s;
    text-decoration: none;
  }
  .btn-jump:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(79, 70, 229, .35);
  }
  .btn-jump:active { transform: translateY(0); }

  .footer-note {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 400px) {
    .wrap { padding: 30px 20px 24px; border-radius: 16px; }
    .icon-wrap { width: 64px; height: 64px; border-radius: 18px; }
    .icon-wrap svg { width: 32px; height: 32px; }
    h1 { font-size: 19px; }
    .subtitle { font-size: 13px; margin-bottom: 20px; }
    .new-url-box { padding: 12px 14px; margin-bottom: 18px; }
    .new-url { font-size: 12.5px; }
    .countdown-num { font-size: 17px; }
    .btn-jump { font-size: 14px; padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="icon-wrap">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h18"/>
      <path d="M12 3a15.3 15.3 0 0 1 4 9 15.3 15.3 0 0 1-4 9 15.3 15.3 0 0 1-4-9 15.3 15.3 0 0 1 4-9z"/>
      <circle cx="12" cy="12" r="9"/>
    </svg>
  </div>

  <h1>网站已搬迁</h1>
  <p class="subtitle">我们换新家啦，请前往新网址继续访问学生论坛。</p>

  <div class="new-url-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    <span class="new-url">chat.zhdd.party</span>
  </div>

  <div class="countdown-wrap">
    <div class="countdown-text">
      <span class="countdown-num" id="countdownNum">10</span> 秒后自动跳转
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <a class="btn-jump" id="jumpBtn" href="https://chat.zhdd.party">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
    立即前往新网站
  </a>

  <p class="footer-note">如果长时间没有自动跳转，请点击上方按钮。</p>
</div>

<script>
(function () {
  var NEW_URL = 'https://chat.zhdd.party';
  var TOTAL_SECONDS = 10;
  var remaining = TOTAL_SECONDS;

  var numEl = document.getElementById('countdownNum');
  var barEl = document.getElementById('progressBar');
  var jumpBtn = document.getElementById('jumpBtn');

  function updateProgress() {
    var done = TOTAL_SECONDS - remaining;
    var pct = Math.min(100, Math.max(0, (done / TOTAL_SECONDS) * 100));
    barEl.style.width = pct + '%';
  }

  // 每秒更新
  var timer = setInterval(function () {
    remaining -= 1;

    if (remaining < 0) {
      clearInterval(timer);
      return;
    }

    numEl.textContent = remaining;
    numEl.classList.add('tick');
    setTimeout(function () { numEl.classList.remove('tick'); }, 150);

    updateProgress();

    if (remaining === 0) {
      clearInterval(timer);
      window.location.replace(NEW_URL);
    }
  }, 1000);

  // 初始化进度条（从 0 开始）
  updateProgress();

  // 手动跳转
  jumpBtn.addEventListener('click', function (e) {
    e.preventDefault();
    clearInterval(timer);
    window.location.replace(NEW_URL);
  });

  // 提前预连接，跳转更快
  var preconnect = document.createElement('link');
  preconnect.rel = 'preconnect';
  preconnect.href = NEW_URL;
  document.head.appendChild(preconnect);

  var dnsPrefetch = document.createElement('link');
  dnsPrefetch.rel = 'dns-prefetch';
  dnsPrefetch.href = NEW_URL;
  document.head.appendChild(dnsPrefetch);
})();
</script>

</body>
</html>
