<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>阳光森林 - 网络安全空间</title>
    <link rel="icon" href="photo1.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --blue: #3498db; --red: #e74c3c; --pink: #e84393; --yellow: #f1c40f;
            --orange: #e67e22; --green: #2ecc71; --purple: #9b59b6;
            --dark-bg: #0a0e17; --light-bg: #1a1f2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            background-color: var(--dark-bg); color: #fff; min-height: 100vh; overflow-x: hidden;
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            background-image: linear-gradient(rgba(10, 14, 23, 0.6), rgba(10, 14, 23, 0.6)), url('photo3.jpg');
        }
        a, button, .circular-action-btn, .friend-link-item, .music-player-btn, .sticky-note, .admin-link {
            cursor: pointer;
        }
        /* 协议弹窗 */
        .agreement-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.96);
            backdrop-filter: blur(15px);
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .agreement-card {
            background: rgba(26,31,46,0.95);
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 550px;
            width: 90%;
            border: 1px solid rgba(52,152,219,0.4);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            max-height: 85vh;
            overflow-y: auto;
        }
        .agreement-card h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #fff;
        }
        .agreement-card p {
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .agreement-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        .agreement-link {
            background: rgba(52,152,219,0.1);
            border: 1px solid rgba(52,152,219,0.3);
            border-radius: 12px;
            padding: 12px 20px;
            color: var(--blue);
            text-decoration: none;
            transition: 0.2s;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }
        .agreement-link:hover {
            background: rgba(52,152,219,0.25);
            color: #fff;
        }
        .agreement-btn {
            background: linear-gradient(45deg, var(--blue), var(--pink));
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .agreement-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(52,152,219,0.3);
        }
        /* 文档内容弹窗 */
        .doc-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 110000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.25s;
        }
        .doc-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .doc-modal-card {
            background: rgba(26,31,46,0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(52,152,219,0.4);
            position: relative;
        }
        .doc-modal-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
            text-align: center;
        }
        .doc-modal-content {
            color: #ccc;
            line-height: 1.8;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .doc-modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .doc-modal-close:hover { color: #fff; }
        /* 其余样式与之前相同，此处省略以节省篇幅，请根据之前版本复制 */
        /* ... 完整样式请参考上一份代码 ... */
        /* 资源下载、音乐、声浪条等样式请保留 */
    </style>
</head>
<body>
    <!-- 协议弹窗 -->
    <div class="agreement-overlay" id="agreementOverlay">
        <div class="agreement-card">
            <h2><i class="fas fa-shield-alt"></i> 欢迎访问阳光森林</h2>
            <p>您访问此网页，即表示您已阅读并同意以下协议</p>
            <div class="agreement-links">
                <button class="agreement-link" data-doc="agreement.docx"><i class="fas fa-file-contract"></i> 用户协议</button>
                <button class="agreement-link" data-doc="privacy.docx"><i class="fas fa-user-shield"></i> 隐私政策</button>
                <button class="agreement-link" data-doc="third-party.docx"><i class="fas fa-share-alt"></i> 第三方应用共享清单</button>
            </div>
            <button class="agreement-btn" id="agreeBtn">同意并继续</button>
        </div>
    </div>

    <!-- 文档内容弹窗 -->
    <div class="doc-modal" id="docModal">
        <div class="doc-modal-card">
            <button class="doc-modal-close" id="closeDocModal"><i class="fas fa-times"></i></button>
            <h3 id="docModalTitle">文档</h3>
            <div class="doc-modal-content" id="docModalContent">加载中...</div>
        </div>
    </div>

    <!-- 隐私政策弹窗（旧版兼容，可忽略） -->
    <!-- 管理员弹窗、二维码弹窗等保持不变 -->

    <script>
        // ==================== Word 文档解析 ====================
        async function loadDocxText(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer });
                return result.value;
            } catch (err) {
                console.error('加载文档失败:', err);
                return '文档加载失败：' + err.message;
            }
        }

        // ==================== 协议弹窗逻辑 ====================
        const agreementOverlay = document.getElementById('agreementOverlay');
        const agreeBtn = document.getElementById('agreeBtn');
        const docModal = document.getElementById('docModal');
        const docModalTitle = document.getElementById('docModalTitle');
        const docModalContent = document.getElementById('docModalContent');
        const closeDocModalBtn = document.getElementById('closeDocModal');

        // 加载并显示文档
        async function showDoc(docFile, title) {
            docModalTitle.textContent = title;
            docModalContent.textContent = '加载中...';
            docModal.classList.add('active');
            const text = await loadDocxText(docFile);
            docModalContent.textContent = text;
        }

        // 绑定三个文档按钮
        document.querySelectorAll('.agreement-link').forEach(btn => {
            btn.addEventListener('click', async () => {
                const docFile = btn.dataset.doc;
                const title = btn.textContent.trim();
                await showDoc(docFile, title);
            });
        });

        // 关闭文档弹窗
        closeDocModalBtn.addEventListener('click', () => {
            docModal.classList.remove('active');
        });
        docModal.addEventListener('click', (e) => {
            if (e.target === docModal) docModal.classList.remove('active');
        });

        // 同意协议
        agreeBtn.addEventListener('click', () => {
            agreementOverlay.style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            startSite();
        });

        // ==================== 200句名言从 quotes.docx 加载 ====================
        let quoteLibrary = [];

        async function loadQuotes() {
            const text = await loadDocxText('quotes.docx');
            const lines = text.split('\n').filter(line => line.trim());
            quoteLibrary = lines.map(line => {
                const parts = line.split('|');
                if (parts.length >= 2) {
                    return { text: parts[0].trim(), author: parts[1].trim() };
                }
                return { text: line.trim(), author: '未知' };
            });
            console.log(`已加载 ${quoteLibrary.length} 句名言`);
        }

        // ==================== 音乐系统（从 music 文件夹随机播放） ====================
        // 与之前相同，请参考前面的代码实现
        // ...

        // ==================== 页面初始化 ====================
        document.addEventListener('DOMContentLoaded', async () => {
            createVisualizerBars();
            await loadQuotes(); // 先加载名言
            agreementOverlay.style.display = 'flex'; // 显示协议弹窗
            // 其他初始化
        });

        // 其他函数（资源下载、音乐、管理员等）请参考之前完整版本
        // 此处省略，但实际使用时必须保留
    </script>
</body>
</html>
