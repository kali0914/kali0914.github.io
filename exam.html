<div class="registerPage">
    <div class="registerDiv">
        <form>
            <div class="usernameWrapDiv">
                <div class="usernameLabel">
                    <label>用户名:</label>
                </div>
                <div class="usernameDiv">
                    <i class="layui-icon layui-icon-username adminIcon"></i>
                    <input id="registerUsername" class="layui-input adminInput" type="text" name="username" placeholder="输入用户名">
                </div>
            </div>
            <div class="usernameWrapDiv">
                <div class="usernameLabel">
                    <label>密码:</label>
                </div>
                <div class="passwordDiv">
                    <i class="layui-icon layui-icon-password adminIcon"></i>
                    <input id="registerPassword" class="layui-input adminInput" type="password" name="password" placeholder="输入密码">
                </div>
            </div>
            <div class="usernameWrapDiv">
                <div class="usernameLabel">
                    <label>确认密码:</label>
                </div>
                <div class="passwordDiv">
                    <i class="layui-icon layui-icon-password adminIcon"></i>
                    <input id="registerWellPassword" class="layui-input adminInput" type="password" name="password" placeholder="输入密码">
                </div>
            </div>
            <div class="usernameWrapDiv">
                <div class="usernameLabel">
                    <label>角色类型:</label>
                </div>
                <div class="passwordDiv">
                    <select id="roleSelect" class="layui-select">
                        <option value="">请选择...</option>
                        <option value="0">管理员</option>
                        <option value="1">学生</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
</div>

<!--修改密码-->
<div class="changePasswordPage" style="display: none;">
    <div class="addDiv">
        <div class="layui-form add-from-margin" id="">

            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">原密码</label>
                    <div class="layui-input-inline inputWidth layui-input-style">
                        <input type="password" name="email" id="oldPassword" lay-verify="email" autocomplete="off" class="layui-input" placeholder="输入原密码">
                        <div class="icon-css-view">
                            <!-- <i id="iconShowView" class="layui-icon layui-icon-face-smile" style="color: lawngreen;"></i>
                            <i id="iconHiddenView" class="layui-icon layui-icon-face-cry" style="color: orangered;" hidden></i> -->
                            <span id="iconShowView" style="color: lawngreen;">查看</span>
                            <span id="iconHiddenView" style="color: orangered;" hidden>隐藏</span>
                        </div>    
                    </div>
                </div>
            </div>
            <hr style="width: 500px; margin-left: 50px;">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">新密码</label>
                    <div class="layui-input-inline inputWidth">
                        <input type="password" name="email" id="newPassword" lay-verify="email" autocomplete="off" class="layui-input" placeholder="输入新密码">
                        <div class="icon-css-view">
                            <!-- <i id="iconShowView2" class="layui-icon layui-icon-face-smile" style="color: lawngreen;"></i>
                            <i id="iconHiddenView2" class="layui-icon layui-icon-face-cry" style="color: orangered;" hidden></i> -->
                            <span id="iconShowView2" style="color: lawngreen;">查看</span>
                            <span id="iconHiddenView2" style="color: orangered;" hidden>隐藏</span>
                        </div>
                    </div>
                </div>
            </div>
            <hr style="width: 500px; margin-left: 50px;">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">确认密码</label>
                    <div class="layui-input-inline inputWidth">
                        <input type="password" name="email" id="confirmPassword" lay-verify="email" autocomplete="off" class="layui-input" placeholder="输入新密码">
                        <div class="icon-css-view">
                            <!-- <i id="iconShowView3" class="layui-icon layui-icon-face-smile" style="color: lawngreen;"></i>
                            <i id="iconHiddenView3" class="layui-icon layui-icon-face-cry" style="color: orangered;" hidden></i> -->
                            <span id="iconShowView3" style="color: lawngreen;">查看</span>
                            <span id="iconHiddenView3" style="color: orangered;" hidden>隐藏</span>
                        </div>
                    </div>
                </div>
            </div>
            <hr style="width: 500px; margin-left: 50px;">
        </div>
    </div>
</div>
