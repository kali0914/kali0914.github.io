            --dark-bg: #0a0e17; --light-bg: #1a1f2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body {
            background-color: var(--dark-bg); color: #fff; min-height: 100vh;
            display: flex;
        }
        /* 侧边栏 */
        .sidebar {
            width: 280px; background: rgba(26,31,46,0.95); backdrop-filter: blur(10px);

        .sidebar-header { text-align: center; margin-bottom: 20px; }
        .sidebar-avatar {
            width: 75px; height: 75px; border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--pink));
            margin: 0 auto 10px; display: flex; align-items: center;
            justify-content: center; font-size: 2rem; color: white;
            box-shadow: 0 8px 20px rgba(52,152,219,0.3);

        .sidebar-username { font-size: 1.2rem; font-weight: bold; color: white; }
        .sidebar-email { font-size: 0.7rem; color: #888; margin-top: 2px; }
        .sidebar-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.06); }

        .info-value { font-size: 1.1rem; color: white; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .edit-inline-btn { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 0.9rem; transition: 0.2s; }

        .auth-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .auth-form { display: none; }

        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }

        @media (max-width: 768px) {
            .sidebar { width: 240px; }

            .section-title { font-size: 1.5rem; }
            .profile-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                    document.getElementById(this.dataset.auth === 'login' ? 'loginForm' : 'registerForm').classList.add('active');
                });
            });

            // 发送验证码 (注册)
            getCodeBtn.addEventListener('click', async () => {
                const email = document.getElementById('signupEmail').value.trim();
                if (!email) { signupMessage.textContent = '请输入邮箱'; return; }
                generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
                codeExpiry = Date.now() + 5 * 60 * 1000;
                getCodeBtn.disabled = true; getCodeBtn.textContent = '发送中...';
                try {
                    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: email, code: generatedCode });
                    signupMessage.textContent = '验证码已发送'; signupMessage.style.color = '#2ecc71';
                    getCodeBtn.textContent = '重新发送'; getCodeBtn.disabled = false;
                } catch (e) {
                    signupMessage.textContent = '发送失败：' + (e.text || e.message); signupMessage.style.color = '#e74c3c';
                    getCodeBtn.textContent = '获取验证码'; getCodeBtn.disabled = false;
                }
            });

            // 登录
            loginBtn.addEventListener('click', async () => {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if (!email || !password) { loginMessage.textContent = '请填写邮箱和密码'; return; }
                loginMessage.textContent = '登录中...';
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { loginMessage.textContent = error.message.includes('Invalid login') ? '邮箱或密码错误' : error.message; }
                else { updateUIBySession(); }
            });

            // 注册
            signupBtn.addEventListener('click', async () => {
                const email = document.getElementById('signupEmail').value.trim();
                const code = document.getElementById('verificationCode').value.trim();
                const password = document.getElementById('signupPassword').value.trim();
                const confirm = document.getElementById('signupConfirm').value.trim();
                if (!email || !code || !password || !confirm) { signupMessage.textContent = '请完整填写所有字段'; return; }
                if (password.length < 6) { signupMessage.textContent = '密码至少6位'; return; }
                if (password !== confirm) { signupMessage.textContent = '两次密码不一致'; return; }
                if (Date.now() > codeExpiry) { signupMessage.textContent = '验证码已过期'; return; }
                if (code !== generatedCode) { signupMessage.textContent = '验证码错误'; return; }
                signupMessage.textContent = '注册中...';
                const { error } = await supabase.auth.signUp({ email, password, options: { data: { bio: '' } } });
                if (error) { signupMessage.textContent = error.message.includes('already registered') ? '该邮箱已被注册' : error.message; }
                else { signupMessage.textContent = '注册成功！'; signupMessage.style.color = '#2ecc71'; setTimeout(() => updateUIBySession(), 1000); }
            });

            // 退出
            logoutBtn.addEventListener('click', async () => { await supabase.auth.signOut(); updateUIBySession(); });
            document.getElementById('backHomeBtn').addEventListener('click', () => window.location.href = 'index.html');

            // 昵称编辑
            document.getElementById('editNicknameBtn').addEventListener('click', () => {
                const cur = displayName.textContent.trim();
                const container = document.getElementById('displayNameContainer');
                container.innerHTML = `<input type="text" class="inline-input" id="nicknameInput" value="${cur}" maxlength="20" /><button class="save-btn" id="nicknameSaveBtn">保存</button><button class="edit-inline-btn" id="nicknameCancelBtn"><i class="fas fa-times"></i></button>`;
                document.getElementById('nicknameSaveBtn').addEventListener('click', async () => {
                    const n = document.getElementById('nicknameInput').value.trim();
                    if (!n || n.length > 20) return alert('昵称不能为空且不超过20个字符');
                    const { error } = await supabase.auth.updateUser({ data: { nickname: n } });
                    if (error) alert(error.message); else updateUIBySession();
                });
                document.getElementById('nicknameCancelBtn').addEventListener('click', () => updateUIBySession());
            });

            // 个人简介编辑
            document.getElementById('editBioBtn').addEventListener('click', () => {
                const cur = displayBio.textContent || '';
                const container = document.getElementById('bioContainer');
                container.innerHTML = `<input type="text" class="inline-input" id="bioInput" value="${cur}" maxlength="100" placeholder="介绍一下自己" /><button class="save-btn" id="bioSaveBtn">保存</button><button class="edit-inline-btn" id="bioCancelBtn"><i class="fas fa-times"></i></button>`;
                document.getElementById('bioSaveBtn').addEventListener('click', async () => {
                    const bio = document.getElementById('bioInput').value.trim();
                    const { error } = await supabase.auth.updateUser({ data: { bio: bio } });
                    if (error) alert(error.message); else updateUIBySession();
                });
                document.getElementById('bioCancelBtn').addEventListener('click', () => updateUIBySession());
            });

            // 修改密码
            document.getElementById('changePasswordBtn').addEventListener('click', async () => {
                const curPwd = document.getElementById('currentPassword').value;
                const newPwd = document.getElementById('newPassword').value.trim();
                const confirmPwd = document.getElementById('confirmNewPassword').value.trim();
                const msg = document.getElementById('passwordMessage');
                if (!newPwd || newPwd.length < 6) { msg.textContent = '新密码至少6位'; return; }
                if (newPwd !== confirmPwd) { msg.textContent = '两次新密码不一致'; return; }
                // 如果有当前密码，先验证（可选，Supabase updateUser 不需要旧密码，但为了安全可以验证一下）
                // 这里简单处理：直接更新密码
                const { error } = await supabase.auth.updateUser({ password: newPwd });
                if (error) { msg.textContent = '密码修改失败：' + error.message; }
                else { msg.textContent = '密码修改成功'; msg.style.color = '#2ecc71'; }
            });

            // 忘记密码流程
            const forgotModal = document.getElementById('forgotModal');
            const forgotEmailInput = document.getElementById('forgotEmail');
            const forgotCodeInput = document.getElementById('forgotCode');
            const forgotNewPassword = document.getElementById('forgotNewPassword');
            const forgotGetCodeBtn = document.getElementById('forgotGetCodeBtn');
            const forgotSubmitBtn = document.getElementById('forgotSubmitBtn');
            const forgotMessage = document.getElementById('forgotMessage');

            document.getElementById('forgotPasswordLink').addEventListener('click', () => {
                forgotModal.classList.add('active');
                forgotEmailInput.value = '';
                forgotCodeInput.value = '';
                forgotNewPassword.value = '';
                forgotMessage.textContent = '';
            });
            document.getElementById('closeForgotModal').addEventListener('click', () => forgotModal.classList.remove('active'));
            forgotModal.addEventListener('click', (e) => { if (e.target === forgotModal) forgotModal.classList.remove('active'); });

            forgotGetCodeBtn.addEventListener('click', async () => {
                const email = forgotEmailInput.value.trim();
                if (!email) { forgotMessage.textContent = '请输入邮箱'; return; }
                forgotGeneratedCode = Math.floor(100000 + Math.random() * 900000).toString();
                forgotCodeExpiry = Date.now() + 5 * 60 * 1000;
                forgotGetCodeBtn.disabled = true; forgotGetCodeBtn.textContent = '发送中...';
                try {
                    await emailjs.send(EMAILJS_SERVICE_ID, FORGOT_TEMPLATE_ID, { to_email: email, code: forgotGeneratedCode });
                    forgotMessage.textContent = '验证码已发送'; forgotMessage.style.color = '#2ecc71';
                    forgotGetCodeBtn.textContent = '重新发送'; forgotGetCodeBtn.disabled = false;
                } catch (e) {
                    forgotMessage.textContent = '发送失败：' + (e.text || e.message); forgotMessage.style.color = '#e74c3c';
                    forgotGetCodeBtn.textContent = '获取验证码'; forgotGetCodeBtn.disabled = false;
                }
            });

            forgotSubmitBtn.addEventListener('click', async () => {
                const email = forgotEmailInput.value.trim();
                const code = forgotCodeInput.value.trim();
                const newPassword = forgotNewPassword.value.trim();
                if (!email || !code || !newPassword) { forgotMessage.textContent = '请填写完整'; return; }
                if (newPassword.length < 6) { forgotMessage.textContent = '密码至少6位'; return; }
                if (Date.now() > forgotCodeExpiry) { forgotMessage.textContent = '验证码已过期'; return; }
                if (code !== forgotGeneratedCode) { forgotMessage.textContent = '验证码错误'; return; }
                // 使用验证码登录并修改密码
                const { error: verifyError } = await supabase.auth.verifyOtp({ email, token: code, type: 'email' });
                if (verifyError) { forgotMessage.textContent = '验证失败：' + verifyError.message; return; }
                const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
                if (updateError) { forgotMessage.textContent = '重置失败：' + updateError.message; }
                else {
                    forgotMessage.textContent = '密码重置成功'; forgotMessage.style.color = '#2ecc71';
                    setTimeout(() => { forgotModal.classList.remove('active'); updateUIBySession(); }, 1000);
                }
            });

            // 更新界面
            async function updateUIBySession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    authContainer.style.display = 'none'; profileContainer.style.display = 'block'; logoutBtn.style.display = 'flex';
                    const user = session.user;
                    const nickname = user.user_metadata?.nickname || user.email.split('@')[0];
                    const bio = user.user_metadata?.bio || '';
                    sidebarUsername.textContent = nickname; sidebarEmail.textContent = user.email;
                    displayName.textContent = nickname; displayEmail.textContent = user.email;
                    displayCreated.textContent = new Date(user.created_at).toLocaleDateString('zh-CN');
                    displayBio.textContent = bio;
                    const days = Math.floor((Date.now() - new Date(user.created_at).getTime()) / 86400000);
                    statDays.textContent = days + '天'; statAICount.textContent = '0'; statArticles.textContent = '3';
                } else {
                    authContainer.style.display = 'block'; profileContainer.style.display = 'none'; logoutBtn.style.display = 'none';
                    sidebarUsername.textContent = '请登录'; sidebarEmail.textContent = '未登录';
                    statDays.textContent = '--'; statAICount.textContent = '--'; statArticles.textContent = '--';
                }
            }
            updateUIBySession().catch(console.error);
        });
    </script>
</body>
</html>
